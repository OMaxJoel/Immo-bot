# ===================== CRITÈRES (modifiables aussi via Telegram : /budget, /localisation) =====================
search:
  max_budget_fcfa: 150000
  prefer_unfurnished: true
  max_age_days: 14          # au-delà, l'annonce est signalée "ancienne" et perd des points
  min_relevance: 60         # en dessous, l'annonce n'est pas envoyée
  zones:
    - name: "Riviera 2"
      aliases: ["riviera 2", "riviera2", "riviera ii", "rivera 2"]
    - name: "Riviera Anono"
      aliases: ["anono", "riviera anono"]
    - name: "Riviera Attoban"
      aliases: ["attoban", "riviera attoban"]
    - name: "Blockhaus"
      aliases: ["blockhaus", "block haus", "blokhaus"]
    - name: "Deux-Plateaux"
      aliases: ["deux plateaux", "2 plateaux", "deux-plateaux", "2plateaux", "ii plateaux"]

# ===================== GEMINI (quota gratuit) =====================
gemini:
  model: "gemini-2.5-flash-lite"   # vérifiez le modèle gratuit le plus généreux sur https://ai.google.dev/gemini-api/docs/rate-limits
  max_calls_per_run: 40            # plafond par exécution pour rester dans le quota gratuit
  seconds_between_calls: 6.5       # ~9 requêtes/minute

# ===================== PLANIFICATION =====================
schedule:
  daily_digest_hour_utc: 20        # Abidjan = UTC+0
  daemon_interval_minutes: 30      # utilisé uniquement en mode --daemon
  fetch_delay_seconds: 2           # politesse envers les sites
  max_new_per_source: 15           # nb max de nouvelles annonces examinées par source et par passage

# ===================== SOURCES =====================
# ⚠️ Les URL ci-dessous sont des points de départ NON VÉRIFIÉS : les sites changent souvent.
# Pour chaque source : ouvrez le site, filtrez (Location > Appartement > Cocody...), copiez l'URL de
# la page de résultats ici, puis lancez :  python -m src.main --check-sources
# "link_regex" (optionnel) = motif des liens d'annonces individuelles (ex: "/annonce/").
